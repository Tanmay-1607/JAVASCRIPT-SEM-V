<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Workshop Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Technical Workshop</h1>
        <p class="subtitle">Student Ticket Booking Form</p>

        <form id="workshopForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" placeholder="Enter phone number">
                </div>

                <div class="form-group">
                    <label for="college">College Name *</label>
                    <input type="text" id="college" placeholder="Enter college name">
                </div>

                <div class="form-group">
                    <label for="course">Course / Branch *</label>
                    <input type="text" id="course" placeholder="Enter course or branch">
                </div>

                <div class="form-group">
                    <label for="year">Year *</label>
                    <select id="year">
                        <option value="">Select Year</option>
                        <option>First Year</option>
                        <option>Second Year</option>
                        <option>Third Year</option>
                        <option>Final Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="workshop">Workshop Topic *</label>
                    <select id="workshop">
                        <option value="">Select Topic</option>
                        <option>Artificial Intelligence</option>
                        <option>Web Development</option>
                        <option>Data Science</option>
                        <option>Cyber Security</option>
                        <option>Cloud Computing</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Workshop Date *</label>
                    <input type="date" id="date">
                </div>

            </div>

            <fieldset>
                <legend>Ticket Type *</legend>

                <label class="radio">
                    <input type="radio" name="ticket" value="Standard">
                    Standard
                </label>

                <label class="radio">
                    <input type="radio" name="ticket" value="Premium">
                    Premium
                </label>
            </fieldset>

            <div class="form-group">
                <label for="message">Special Requirements</label>
                <textarea id="message" rows="4"
                    placeholder="Enter special requirements"></textarea>
            </div>

            <label class="checkbox">
                <input type="checkbox" id="terms">
                I confirm that the information provided is correct.
            </label>

            <div class="buttons">

                <button type="submit">Book Ticket</button>

                <button type="button" id="saveLocal">
                    Save Local
                </button>

                <button type="button" id="saveSession">
                    Save Session
                </button>

                <button type="button" id="loadData">
                    Load Data
                </button>

                <button type="button" id="clearData">
                    Clear Data
                </button>

                <button type="reset" id="resetBtn">
                    Reset Form
                </button>

            </div>

            <p id="result"></p>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
