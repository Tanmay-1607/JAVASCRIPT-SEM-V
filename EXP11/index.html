
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Countdown Scheduler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Class Countdown</h1>
            <p>Stay organized. Be on time.</p>
        </header>

        <section class="timer-card">
            <h2 id="eventTitle">Next Class</h2>
            <p id="eventDate">Select your class date and time</p>

            <div class="countdown">
                <div class="time-box">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>
            </div>

            <p id="status">Set your next class below.</p>
        </section>

        <section class="form-card">
            <h2>Schedule a Class</h2>

            <form id="scheduleForm">
                <label for="className">Class Name</label>
                <input type="text" id="className"
                       placeholder="e.g. JavaScript Lecture" required>

                <label for="classDate">Date and Time</label>
                <input type="datetime-local" id="classDate" required>

                <button type="submit">Start Countdown</button>
            </form>
        </section>

        <footer>
            <p>Dynamic Countdown Scheduler | JavaScript Practical 1</p>
        </footer>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
